[project]
name = "petsourcing"
version = "0.0.1"
description = "Multi-agent product research & decision workbench for pet supplies (phase 0: data layer, import, unit economics)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
petsrc = "petsourcing.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petsourcing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
