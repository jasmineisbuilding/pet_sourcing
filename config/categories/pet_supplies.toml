# 品类配置（category profile）：宠物用品
#
# 核心代码与品类无关；换品类时只需新增一份这样的文件。
# 所有默认值都是「假设」，不是事实。成本引擎使用它们时会明确标注来源为
# "profile default"，提醒你用真实报价 / 政策数据替换。

key = "pet_supplies"
name = "宠物用品"
default_market = "CA"

# 评论打标用的痛点词表（第 1 阶段 LLM 打标时作为候选，允许新增）
pain_point_taxonomy = [
  "难清洗",
  "耐用性差 / 易坏",
  "宠物不愿使用",
  "尺寸不合适",
  "材质异味 / 安全担忧",
  "掉毛 / 毛发处理",
  "噪音",
  "占地 / 不好收纳",
  "与描述不符",
  "价格偏高",
]

# 证据「保鲜期」（天）：超过后在调查中会被标为「可能过时」，需要重新采集。
# 这是长期记忆不使用过期信息的第一道防线。
[freshness_days]
listing = 30      # 商品页面价格、描述变化快
quote = 60        # 供应商报价
policy = 180      # 平台费用、关税、法规（仍需每次决策前人工核实）
review = 365
discussion = 365
interview = 365
note = 365

# 成本默认值 —— 全部是占位假设，必须用真实数据替换
[cost_defaults.return_rate]
value = 0.08
note = "假设值：宠物用品退货率，需要用真实店铺数据或平台报告替换"

[cost_defaults.loss_per_return]
value = 8.0
note = "假设值（CAD）：每次退货的损失（运费 + 无法二次销售的部分）"

[cost_defaults.payment_rate]
value = 0.0
note = "假设值：独立站支付手续费比例；走 Amazon 时通常已含在平台佣金中，需核实"

[cost_defaults.duty_rate]
value = 0.0
note = "未知：关税税率取决于 HS 编码和原产地，必须向 CBSA 税则或报关行核实"

[cost_defaults.sell_through]
value = 0.7
note = "假设值：小批量测试期内的售罄比例"

# 合规检查清单（质疑 Agent 和人工复核时使用）
compliance_checklist = [
  "是否为可食用产品（零食 / 保健品）？若是，涉及额外监管，第一版避开",
  "是否含电池或电子元件？涉及运输限制与认证",
  "包装与标签是否需要英法双语？",
  "材料是否有安全声明需求（如接触食物 / 宠物啃咬）？",
  "是否可能涉及他人专利或外观设计？",
]

# 质疑 Agent 的品类特有检查项
challenger_checklist = [
  "评论数量被当成了销量吗？",
  "痛点比例有没有给出分母（已收集样本量）？",
  "宠物个体差异：是否只是少数宠物不适应？",
  "季节性：需求是否集中在某个季节（如冬季狗狗用品）？",
  "尺码类产品的退货风险是否被计入？",
  "已有竞品是否已经解决了这个痛点（看好评，而不只是差评）？",
]

# 推荐的数据来源（仅供参考，使用时遵守各平台条款）
data_sources = [
  "电商平台商品页与公开评论（手动导入）",
  "Reddit / 宠物论坛讨论",
  "自己的用户访谈",
  "1688 / 供应商报价",
]
